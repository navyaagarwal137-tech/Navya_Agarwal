<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f7fb;
      --panel: #ffffff;
      --text: #24232b;
      --muted: #777783;
      --border: #e7e5ed;
      --accent: #24202d;
      --hover: #efedf4;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      padding: 18px 12px;
      background: #f1eff5;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 7px 25px;
      font-size: 19px;
      font-weight: bold;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .new-chat {
      padding: 12px;
      margin-bottom: 24px;
      text-align: left;
      color: var(--text);
      background: transparent;
      border: 1px solid #dfdce6;
      border-radius: 10px;
    }

    .new-chat:hover,
    .history-item:hover {
      background: var(--hover);
    }

    .group-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      padding: 0 8px 8px;
    }

    .history {
      overflow-y: auto;
    }

    .history-item {
      display: block;
      width: 100%;
      padding: 11px 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #393743;
      background: transparent;
      border: none;
      border-radius: 9px;
      font-size: 14px;
    }

    .history-item.active {
      background: #e5e2ec;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .small-link {
      padding: 10px 8px;
      font-size: 14px;
      color: #514e5b;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 4px 0;
      font-size: 13px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #26222e;
      color: white;
      display: grid;
      place-items: center;
      font-weight: bold;
    }

    .plan {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    /* MAIN CHAT */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 26px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
    }

    .topbar span {
      margin-left: 8px;
      color: var(--muted);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 155px;
    }

    /* WELCOME SCREEN */

    .welcome {
      max-width: 720px;
      margin: 70px auto 50px;
      text-align: center;
    }

    .welcome-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 22px;
      border-radius: 16px;
      background: #777783;
      color: white;
      display: grid;
      place-items: center;
      font-size: 27px;
    }

    .welcome h1 {
      margin: 0 0 12px;
      font-size: clamp(25px, 3vw, 34px);
    }

    .welcome p {
      color: var(--muted);
      font-size: 15px;
    }

    /* MESSAGES */

    .messages {
      max-width: 850px;
      margin: 0 auto;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin: 25px 0;
      line-height: 1.65;
    }

    .message-body {
      flex: 1;
      min-width: 0;
      padding-top: 2px;
    }

    .sender {
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .message p {
      margin: 0 0 10px;
      overflow-wrap: anywhere;
    }

    /* CODE BLOCK */

    .codebox {
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid #34303e;
      border-radius: 12px;
      background: #211e29;
      color: #f4efff;
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #302b38;
      font-size: 12px;
    }

    .copy {
      border: none;
      background: transparent;
      color: white;
    }

    pre {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    /* MESSAGE INPUT */

    .composer-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 20px 14px;
      background: linear-gradient(
        transparent,
        var(--bg) 22%
      );
    }

    .composer {
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 12px 12px 17px;
      border: 1px solid #dedbe5;
      border-radius: 18px;
      background: white;
      box-shadow: 0 5px 22px #1e14320f;
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      min-height: 28px;
      max-height: 140px;
      resize: none;
      padding: 4px 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .send {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-size: 22px;
    }

    .send:hover {
      background: #494354;
    }

    .disclaimer {
      margin-top: 10px;
      text-align: center;
      color: #92909b;
      font-size: 11px;
    }

    .mobile-menu {
      display: none;
      margin-right: 10px;
      border: none;
      background: transparent;
      font-size: 22px;
    }

    /* MOBILE RESPONSIVENESS */

    @media (max-width: 720px) {
      .sidebar {
        position: absolute;
        z-index: 5;
        inset: 0 auto 0 0;
        transform: translateX(-100%);
        transition: transform 0.2s;
        box-shadow: 5px 0 25px #0001;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-menu {
        display: inline-block;
      }

      .topbar {
        padding: 0 15px;
      }

      .chat-area {
        padding: 15px 14px 150px;
      }

      .welcome {
        margin-top: 65px;
      }

      .composer-wrap {
        padding: 14px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="logo">✦</div>
        My AI
      </div>

      <button class="new-chat" id="newChat">
        ＋ &nbsp; New Chat
      </button>

      <div class="history">

        <div class="group-label">Today</div>
        <div id="historyToday"></div>

        <div class="group-label" style="margin-top:18px">
          Yesterday
        </div>

        <div id="historyYesterday">
          <button class="history-item">
            JavaScript questions
          </button>

          <button class="history-item">
            Web development project
          </button>
        </div>

      </div>

      <div class="sidebar-bottom">
        <div class="small-link">⚙ &nbsp; Settings</div>
        <div class="small-link">? &nbsp; Help</div>

        <div class="profile">
          <div class="avatar">S</div>
          <div>
            <strong>Student</strong>
            <div class="plan">Free Plan</div>
          </div>
        </div>
      </div>

    </aside>

    <!-- MAIN SECTION -->

    <main class="main">

      <header class="topbar">
        <button
          class="mobile-menu"
          id="menuBtn"
          aria-label="Open menu"
        >☰</button>

        My AI <span>⌄</span>
      </header>

      <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
          <div class="welcome-logo">✦</div>

          <h1>How can I help you?</h1>

          <p>
            Ask me anything. I can help you learn,
            write, code and explore ideas.
          </p>
        </div>

        <div class="messages" id="messages"></div>

      </section>

      <!-- INPUT AREA -->

      <div class="composer-wrap">

        <form class="composer" id="chatForm">

          <textarea
            id="prompt"
            rows="1"
            placeholder="Message My AI..."
            aria-label="Message My AI"
          ></textarea>

          <button
            class="send"
            type="submit"
            aria-label="Send message"
          >↑</button>

        </form>

        <div class="disclaimer">
          My AI can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>

  <script>
    // SELECT HTML ELEMENTS

    const form = document.getElementById("chatForm");
    const promptInput = document.getElementById("prompt");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const chatArea = document.getElementById("chatArea");
    const historyToday = document.getElementById("historyToday");
    const sidebar = document.getElementById("sidebar");

    // CHAT DATA

    let chats = [];
    let currentChat = null;

    // CREATE A NEW CHAT

    function createChat(title = "New chat") {
      currentChat = {
        title: title,
        messages: []
      };

      chats.unshift(currentChat);

      renderHistory();

      messages.innerHTML = "";
      welcome.style.display = "block";

      sidebar.classList.remove("open");
      promptInput.focus();
    }

    // DISPLAY CHAT HISTORY

    function renderHistory() {
      historyToday.innerHTML = "";

      chats.forEach(function(chat) {
        const button = document.createElement("button");

        button.className =
          "history-item" +
          (chat === currentChat ? " active" : "");

        button.textContent = chat.title;
        button.title = chat.title;

        button.addEventListener("click", function() {
          openChat(chat);
        });

        historyToday.appendChild(button);
      });
    }

    // OPEN AN EXISTING CHAT

    function openChat(chat) {
      currentChat = chat;
      messages.innerHTML = "";

      welcome.style.display =
        chat.messages.length ? "none" : "block";

      chat.messages.forEach(function(item) {
        addMessage(item.role, item.text, false);
      });

      renderHistory();

      sidebar.classList.remove("open");
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ADD A MESSAGE TO THE SCREEN

    function addMessage(role, text, save = true) {
      const row = document.createElement("div");
      row.className = "message";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "S" : "✦";

      const body = document.createElement("div");
      body.className = "message-body";

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = role === "user" ? "You" : "My AI";

      const paragraph = document.createElement("p");
      paragraph.textContent = text;

      body.append(sender, paragraph);
      row.append(avatar, body);
      messages.appendChild(row);

      if (save && currentChat) {
        currentChat.messages.push({
          role: role,
          text: text
        });
      }

      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // DEMO AI RESPONSES

    function demoReply(question) {
      const q = question.toLowerCase();

      if (q.includes("html")) {
        return "HTML stands for HyperText Markup Language. It creates the structure of a web page using headings, paragraphs, images, links and buttons.";
      }

      if (q.includes("css")) {
        return "CSS stands for Cascading Style Sheets. It controls colours, spacing, layout, fonts and responsiveness.";
      }

      if (
        q.includes("javascript") ||
        q.includes(" js ")
      ) {
        return "JavaScript makes web pages interactive. It responds to clicks, validates forms, updates content and communicates with servers.";
      }

      if (
        q.includes("hello") ||
        q.includes("hi")
      ) {
        return "Hi! What would you like to learn or work on today?";
      }

      return "This is a front-end demo, so I can show sample replies but I am not connected to a real AI model yet. Connect this interface to an AI API through a backend server to get intelligent answers.";
    }

    // SEND A MESSAGE

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = promptInput.value.trim();

      if (!text) return;

      if (!currentChat) {
        createChat(
          text.length > 28
            ? text.slice(0, 28) + "…"
            : text
        );
      }

      if (currentChat.messages.length === 0) {
        currentChat.title =
          text.length > 28
            ? text.slice(0, 28) + "…"
            : text;

        renderHistory();
      }

      welcome.style.display = "none";

      addMessage("user", text);

      promptInput.value = "";
      promptInput.style.height = "28px";

      const reply = demoReply(text);

      setTimeout(function() {
        addMessage("ai", reply);
      }, 350);
    });

    // NEW CHAT BUTTON

    document
      .getElementById("newChat")
      .addEventListener("click", function() {
        createChat();
      });

    // MOBILE SIDEBAR BUTTON

    document
      .getElementById("menuBtn")
      .addEventListener("click", function() {
        sidebar.classList.toggle("open");
      });

    // AUTOMATICALLY RESIZE INPUT

    promptInput.addEventListener("input", function() {
      promptInput.style.height = "28px";

      promptInput.style.height =
        Math.min(promptInput.scrollHeight, 140) + "px";
    });

    // ENTER TO SEND, SHIFT + ENTER FOR NEW LINE

    promptInput.addEventListener("keydown", function(event) {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    // SAMPLE PREVIOUS CHATS

    document
      .querySelectorAll("#historyYesterday .history-item")
      .forEach(function(button) {
        button.addEventListener("click", function() {
          createChat(button.textContent);

          addMessage(
            "user",
            "Can you help me with " +
            button.textContent.toLowerCase() + "?"
          );

          welcome.style.display = "none";

          addMessage(
            "ai",
            demoReply(button.textContent)
          );
        });
      });

    // START THE WEBSITE

    createChat();

  </script>

</body>
</html>
