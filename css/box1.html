<html>
    <head>
        <title>Simple Cards</title>
        <style>
            .card{
                width: 300px;
                background-color:red;
                border: 10px solid black;
                padding: 20px;
                border-radius: 20px;
                text-align: center;
                height: 200px;
                border-style: double;
                margin: 30px;
        
            }
            .card h1{
color:blue;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            font-family: Arial, sans-serif;


            }
            .card p{
                color:pink;
                font-size: 16px;
                text-align:centre;
                font-style: italic;

            }
            
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Card Title</h1>
            <p>This is a card with a border, padding, and rounded corners.</p>
        </div>
        <div class="card">
            <h1>Card Example</h1>
            <p>This is an example of a card with a border, padding, and rounded corners.</p>
        </div>
    </body>
</html>
