<html>
    <head>
        <style>
            .solid{
                border-style:solid;
                border-color:black;
                border-width:20px;
            }
            .dashed{
                border-style:dashed;
                border-color:green;
                border-width:20px;
            }
            .dotted{
                border-style:dotted;
                border-color:red;
                border-width:30px;
            }
            .double{
                border-style:double;
                border-color:blue;
                border-width:20px;
            }   
        </style>
        <body>
            <p class="solid">This is a solid border.</p>
            <p class="dashed">This is a dashed border.</p> 
            <p class="dotted">This is a dotted border.</p>
            <p class="double">This is a double border.</p>  
        </body>
    </head>
</html>
